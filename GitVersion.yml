mode: Mainline
increment: Inherit
update-build-number: true
branches:
  main:
    regex: '^(main|AB#4275/update-to-tdx)$'
    is-mainline: true
  release:
    regex: .+release?[/-]
    tag: useBranchName
    increment: Major
  feature:
    regex: .+feature?[/-]
    tag: useBranchName
    increment: Minor
  hotfix:
    regex: .+(bugfix|hotfix(es)?)[/-]
    tag: useBranchName
    increment: Patch
ignore: 
  sha: []
merge-message-formats: {}
assembly-file-versioning-format: '{Major}.{Minor}.{Patch}.{env:GITHUB_RUN_NUMBER}'
