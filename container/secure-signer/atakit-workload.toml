format = 8

[workload]
name = "secure-signer"
version = "v0.2.1"
base-image-mode = "whitelist"
base-image = ["0xaef8fc89416f01494ec6534de68d30aab26d7598db8a05967b0ba7d3ecb259d2/automata-linux:v0.3.1-debug"]
image = { build = ".", containerfile = "container/Dockerfile", args = { BINARY_NAME = "secure-signer" } }
ports = ["9003:9001/tcp"]
restart = "unless-stopped"
atakit-portal = true

[workload.environment]
RUST_LOG = "info"
SECURE_SIGNER_PORT = "9001"
GENESIS_FORK_VERSION = "0x10000910"

[workload.storage.data]
disk = "secure-signer-data"
base-path = "/"
mount-path = "/data"
read-only = false

[disks.secure-signer-data]
index = 10
size = "10GB"
encryption = { unlock_method = ["tpm"], bind = ["platform", "baseimage", "workload"] }
