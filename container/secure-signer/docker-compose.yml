services:
  secure-signer:
    image: ghcr.io/pufferfinance/secure-signer:v0.1.5
    build:
      context: ../..
      dockerfile: ./container/Dockerfile
    ports:
      - "9003:9001"
    env_file:
      - ./env    # measured config
    volumes:
      - ./network_config.json:/config/network_config.json:ro
      - secure-signer-data:/data
      - ./cvm-agent.sock:/app/cvm-agent.sock

volumes:
  secure-signer-data:
