format = 8

[workload]
name = "guardian"
version = "v0.2.1"
base-image-mode = "whitelist"
base-image = ["0xaef8fc89416f01494ec6534de68d30aab26d7598db8a05967b0ba7d3ecb259d2/automata-linux:v0.3.1-debug"]
image = { build = ".", containerfile = "container/Dockerfile", args = { BINARY_NAME = "guardian" } }
ports = ["9001:9001/tcp"]
restart = "unless-stopped"
atakit-portal = true

[workload.environment]
RUST_LOG = "info"
GUARDIAN_PORT = "9001"
GENESIS_FORK_VERSION = "0x10000910"
SESSION_REGISTRY_RPC_URL = "https://ethereum-hoodi-rpc.publicnode.com"
SESSION_REGISTRY_ADDRESS = "0x7575BceC155b272077C87aD3Ae5Ef54Cf9DC6601"

[workload.storage.data]
disk = "guardian-data"
base-path = "/"
mount-path = "/data"
read-only = false

[disks.guardian-data]
index = 10
size = "10GB"
encryption = { unlock_method = ["tpm"], bind = ["platform", "baseimage", "workload"] }
